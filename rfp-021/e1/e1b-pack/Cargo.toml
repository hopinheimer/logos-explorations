# Combines the E1b guest's user ELF with RISC Zero's v1compat kernel into the
# ProgramBinary form LEZ loads (what risc0-build would emit).
[workspace]

[package]
name = "e1b-pack"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
risc0-binfmt = "3.0"
risc0-zkos-v1compat = "=2.2.2"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
