# E1b guest: Sextant's light-client core as a LEZ v0.4 actor. A private actor
# verifies a real sync-committee update, then advances the public instance.
[workspace]

[package]
name = "e1b-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "e1b_lc"
path = "src/main.rs"

[dependencies]
sextant-core = { path = "../vendor/sextant/core", default-features = false }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.4.0-rc1" }
borsh = { version = "1.5", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "unstable"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
